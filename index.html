<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>これ〜んゲーム</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #ffe8f4, #fff8fc);
      color: #6b3b55;
      text-align: center;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 34px;
      color: #ff69a8;
      text-shadow: 2px 2px 0 #fff;
      letter-spacing: 0.05em;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: #9b6680;
    }

    .game {
      position: relative;
      width: 100%;
      height: 520px;
      background: linear-gradient(#fff, #fff7fb);
      border: 7px solid #ffb6d5;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(255, 120, 170, 0.25);
    }

    .machine-top {
      height: 72px;
      background: #ffd8e9;
      border-bottom: 4px solid #ffadd1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ff5fa2;
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      opacity: 0.8;
      animation: blink 1.6s infinite alternate;
    }

    .s1 { top: 95px; left: 24px; }
    .s2 { top: 155px; right: 30px; animation-delay: .5s; }
    .s3 { bottom: 120px; left: 34px; animation-delay: .9s; }

    @keyframes blink {
      from { opacity: .25; transform: scale(.9); }
      to { opacity: 1; transform: scale(1.15); }
    }

    .claw {
      position: absolute;
      top: 72px;
      left: 160px;
      width: 62px;
      z-index: 5;
      transition: top .75s ease;
    }

    .rope {
      width: 6px;
      height: 48px;
      background: #c88aa5;
      margin: 0 auto;
      border-radius: 99px;
    }

    .arm {
      font-size: 44px;
      line-height: 34px;
      color: #8b5b72;
    }

    .prize {
      position: absolute;
      bottom: 66px;
      left: 150px;
      width: 76px;
      height: 76px;
      background: #c8edff;
      border: 4px solid #83cdf0;
      border-radius: 22px;
      font-size: 38px;
      line-height: 68px;
      z-index: 3;
      transition: bottom .75s ease, transform .3s ease;
    }

    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: #ffe0ee;
      border-top: 4px dashed #ff95c5;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: bold;
      background: #ff7db8;
      color: white;
      box-shadow: 0 5px 0 #d94f8c;
      cursor: pointer;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #d94f8c;
    }

    button:disabled {
      background: #cfcfcf;
      box-shadow: 0 5px 0 #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      min-height: 30px;
      font-weight: bold;
      font-size: 17px;
      color: #ff5fa2;
    }

    .notice {
      margin-top: 8px;
      font-size: 12px;
      color: #9b6680;
    }

    .otomeOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(60, 40, 70, 0.45);
      z-index: 20;
      padding: 18px;
      align-items: center;
      justify-content: center;
    }

    .otomeCard {
      position: relative;
      width: min(92vw, 520px);
      height: 520px;
      background: linear-gradient(#eaf5ff, #fff);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,.25);
      border: 4px solid #c7ddff;
    }

    .characterArea {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 86px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.8), transparent 60%),
        linear-gradient(135deg, #dff1ff, #ffeaf5);
    }

    .dialogue {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      min-height: 178px;
      background: rgba(255,255,255,.92);
      border: 3px solid #b9d5ff;
      border-radius: 18px;
      padding: 18px;
      text-align: left;
    }

    .name {
      display: inline-block;
      padding: 6px 18px;
      background: #fff;
      border: 2px solid #b9d5ff;
      border-radius: 999px;
      font-weight: bold;
      color: #5b5b8f;
      margin-bottom: 12px;
    }

    .serif {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 16px;
      color: #333;
    }

    .nextBtn {
      margin-top: 12px;
      width: 100%;
      background: #8fb8ff;
      box-shadow: 0 5px 0 #5f8ee0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>これ〜んゲーム</h1>
    <p class="sub">かわいい景品をGETしよう♡<br>※特別な演出が発生する場合があります</p>

    <div class="game">
      <div class="machine-top">KORE〜N GAME</div>

      <div class="sparkle s1">✦</div>
      <div class="sparkle s2">♡</div>
      <div class="sparkle s3">✧</div>

      <div class="claw" id="claw">
        <div class="rope"></div>
        <div class="arm">⌒⌒</div>
      </div>

      <div class="prize" id="prize">🎁</div>
      <div class="floor"></div>
    </div>

    <div class="controls">
      <button id="startBtn">スタート</button>
      <button id="catchBtn" disabled>ここで取る！</button>
    </div>

    <div class="message" id="message">スタートを押してね♡</div>
    <div class="notice">画像はあとで差し替えOKです</div>
  </div>

  <div class="otomeOverlay" id="otomeOverlay">
    <div class="otomeCard">
      <div class="characterArea">🌟</div>

      <div class="dialogue">
        <div class="name" id="characterName">小清水 蓮</div>
        <div class="serif" id="characterSerif"></div>
        <button class="nextBtn" id="closeEventBtn">次へ</button>
      </div>
    </div>
  </div>

  <script>
    const claw = document.getElementById("claw");
    const prize = document.getElementById("prize");
    const startBtn = document.getElementById("startBtn");
    const catchBtn = document.getElementById("catchBtn");
    const message = document.getElementById("message");

    const otomeOverlay = document.getElementById("otomeOverlay");
    const characterName = document.getElementById("characterName");
    const characterSerif = document.getElementById("characterSerif");
    const closeEventBtn = document.getElementById("closeEventBtn");

    let clawX = 160;
    let direction = 1;
    let moving = false;
    let timer = null;
    let nextPlayGuaranteed = false;

    const normalSuccessRate = 0.8;
    const specialEventRateWhenFailed = 0.5;

    const specialMessages = [
      {
        name: "小清水 蓮",
        serif: "あー、失敗しちゃったね。\nじゃあ次は俺が取ってあげるから見てて！"
      },
      {
        name: "小清水 蓮",
        serif: "惜しかったね。\n次は俺に任せて？"
      },
      {
        name: "小清水 蓮",
        serif: "大丈夫。\n次はきっと取れるよ。俺が見てるから。"
      },
      {
        name: "小清水 蓮",
        serif: "そんな顔しないで？\nほら、次は俺の番。"
      }
    ];

    function resetGame() {
      clawX = 160;
      direction = 1;
      moving = false;

      claw.style.left = clawX + "px";
      claw.style.top = "72px";

      prize.style.left = "150px";
      prize.style.bottom = "66px";
      prize.style.transform = "scale(1)";

      message.textContent = nextPlayGuaranteed
        ? "次は特別チャンス♡"
        : "クレーンが動くよ♡";
    }

    function moveClaw() {
      clawX += direction * 4;

      if (clawX > 310) direction = -1;
      if (clawX < 10) direction = 1;

      claw.style.left = clawX + "px";
    }

    startBtn.addEventListener("click", () => {
      resetGame();

      moving = true;
      startBtn.disabled = true;
      catchBtn.disabled = false;

      timer = setInterval(moveClaw, 25);
    });

    catchBtn.addEventListener("click", () => {
      if (!moving) return;

      moving = false;
      clearInterval(timer);

      catchBtn.disabled = true;
      message.textContent = "アーム下降中...";

      claw.style.top = "270px";

      setTimeout(judgeCatch, 850);
    });

    function judgeCatch() {
      const prizeX = prize.offsetLeft;
      const distance = Math.abs(clawX - prizeX);
      const isGoodPosition = distance < 55;

      if (nextPlayGuaranteed) {
        nextPlayGuaranteed = false;
        successCatch("蓮くんが取ってくれたよ♡");
        return;
      }

      const isLucky = Math.random() < normalSuccessRate;

      if (isGoodPosition && isLucky) {
        successCatch("GET！景品を取れたよ♡");
      } else {
        failCatch();
      }
    }

    function successCatch(text) {
      message.textContent = text;
      prize.style.bottom = "230px";
      prize.style.transform = "scale(1.12)";

      setTimeout(() => {
        claw.style.top = "72px";
        startBtn.disabled = false;
      }, 900);
    }

    function failCatch() {
      const showSpecialEvent = Math.random() < specialEventRateWhenFailed;

      if (showSpecialEvent) {
        nextPlayGuaranteed = true;
        showSpecialMessage();
      } else {
        message.textContent = "惜しい！もう一回チャレンジ♡";

        setTimeout(() => {
          claw.style.top = "72px";
          startBtn.disabled = false;
        }, 900);
      }
    }

    function showSpecialMessage() {
      const randomMessage = specialMessages[
        Math.floor(Math.random() * specialMessages.length)
      ];

      characterName.textContent = randomMessage.name;
      characterSerif.textContent = randomMessage.serif;
      otomeOverlay.style.display = "flex";
    }

    closeEventBtn.addEventListener("click", () => {
      otomeOverlay.style.display = "none";
      message.textContent = "次回は確定GETチャンス♡";
      claw.style.top = "72px";
      startBtn.disabled = false;
    });
  </script>
</body>
</html>
