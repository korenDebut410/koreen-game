<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>これ〜んゲーム</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #ffe8f4, #fff8fc);
      color: #6b3b55;
      text-align: center;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 34px;
      color: #ff69a8;
      text-shadow: 2px 2px 0 #fff;
      letter-spacing: 0.05em;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: #9b6680;
    }

    .game {
      position: relative;
      width: 100%;
      height: 520px;
      background: linear-gradient(#fff, #fff7fb);
      border: 7px solid #ffb6d5;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(255, 120, 170, 0.25);
    }

    .machine-top {
      height: 72px;
      background: #ffd8e9;
      border-bottom: 4px solid #ffadd1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ff5fa2;
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      opacity: 0.8;
      animation: blink 1.6s infinite alternate;
      z-index: 1;
    }

    .s1 { top: 95px; left: 24px; }
    .s2 { top: 155px; right: 30px; animation-delay: .5s; }
    .s3 { bottom: 120px; left: 34px; animation-delay: .9s; }

    @keyframes blink {
      from { opacity: .25; transform: scale(.9); }
      to { opacity: 1; transform: scale(1.15); }
    }

    .claw {
      position: absolute;
      top: 72px;
      left: 160px;
      width: 66px;
      z-index: 8;
      transition: top .75s ease, left .75s ease;
    }

    .rope {
      width: 6px;
      height: 48px;
      background: #c88aa5;
      margin: 0 auto;
      border-radius: 99px;
    }

    .clawHead {
      position: relative;
      width: 66px;
      height: 56px;
      margin: 0 auto;
    }

    .clawJoint {
      position: absolute;
      top: 0;
      left: 50%;
      width: 18px;
      height: 18px;
      background: #8b5b72;
      border-radius: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    .clawArm {
      position: absolute;
      top: 12px;
      width: 8px;
      height: 48px;
      background: #8b5b72;
      border-radius: 99px;
      transform-origin: top center;
      transition: transform .35s ease;
    }

    .clawArm.left {
      left: 22px;
      transform: rotate(38deg);
    }

    .clawArm.right {
      right: 22px;
      transform: rotate(-38deg);
    }

    .claw.grabbing .clawArm.left {
      transform: rotate(10deg);
    }

    .claw.grabbing .clawArm.right {
      transform: rotate(-10deg);
    }

    .prizeArea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 70px;
      height: 270px;
      z-index: 3;
    }

    .prizeItem {
      position: absolute;
      width: 86px;
      height: 86px;
      object-fit: contain;
      transition:
        left .7s ease,
        top .7s ease,
        bottom .7s ease,
        transform .4s ease,
        opacity .4s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .prizeItem.caught {
      z-index: 7;
      transform: scale(1.08);
    }

    .prizeItem.drop {
      transform: rotate(18deg) scale(.95);
    }

    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: #ffe0ee;
      border-top: 4px dashed #ff95c5;
      z-index: 2;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: bold;
      background: #ff7db8;
      color: white;
      box-shadow: 0 5px 0 #d94f8c;
      cursor: pointer;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #d94f8c;
    }

    button:disabled {
      background: #cfcfcf;
      box-shadow: 0 5px 0 #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      min-height: 30px;
      font-weight: bold;
      font-size: 17px;
      color: #ff5fa2;
    }

    .notice {
      margin-top: 8px;
      font-size: 12px;
      color: #9b6680;
    }

    .otomeOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(60, 40, 70, 0.45);
      z-index: 20;
      padding: 18px;
      align-items: center;
      justify-content: center;
    }

    .otomeCard {
      position: relative;
      width: min(92vw, 520px);
      height: 520px;
      background: linear-gradient(#eaf5ff, #fff);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,.25);
      border: 4px solid #c7ddff;
    }

    .characterArea {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 86px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.8), transparent 60%),
        linear-gradient(135deg, #dff1ff, #ffeaf5);
    }

    .dialogue {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      min-height: 178px;
      background: rgba(255,255,255,.92);
      border: 3px solid #b9d5ff;
      border-radius: 18px;
      padding: 18px;
      text-align: left;
    }

    .name {
      display: inline-block;
      padding: 6px 18px;
      background: #fff;
      border: 2px solid #b9d5ff;
      border-radius: 999px;
      font-weight: bold;
      color: #5b5b8f;
      margin-bottom: 12px;
    }

    .serif {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 16px;
      color: #333;
    }

    .nextBtn {
      margin-top: 12px;
      width: 100%;
      background: #8fb8ff;
      box-shadow: 0 5px 0 #5f8ee0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>これ〜んゲーム</h1>
    <p class="sub">かわいい景品をGETしよう♡<br>※特別な演出が発生する場合があります</p>

    <div class="game">
      <div class="machine-top">KORE〜N GAME</div>

      <div class="sparkle s1">✦</div>
      <div class="sparkle s2">♡</div>
      <div class="sparkle s3">✧</div>

      <div class="claw" id="claw">
        <div class="rope"></div>
        <div class="clawHead">
          <div class="clawJoint"></div>
          <div class="clawArm left"></div>
          <div class="clawArm right"></div>
        </div>
      </div>

      <div class="prizeArea" id="prizeArea"></div>

      <div class="floor"></div>
    </div>

    <div class="controls">
      <button id="startBtn">スタート</button>
      <button id="catchBtn" disabled>ここで取る！</button>
    </div>

    <div class="message" id="message">スタートを押してね♡</div>
    <div class="notice">画像はあとで差し替えOKです</div>
  </div>

  <div class="otomeOverlay" id="otomeOverlay">
    <div class="otomeCard">
      <div class="characterArea">🌟</div>

      <div class="dialogue">
        <div class="name" id="characterName">小清水 蓮</div>
        <div class="serif" id="characterSerif"></div>
        <button class="nextBtn" id="closeEventBtn">次へ</button>
      </div>
    </div>
  </div>

  <script>
    const claw = document.getElementById("claw");
    const prizeArea = document.getElementById("prizeArea");
    const startBtn = document.getElementById("startBtn");
    const catchBtn = document.getElementById("catchBtn");
    const message = document.getElementById("message");

    const otomeOverlay = document.getElementById("otomeOverlay");
    const characterName = document.getElementById("characterName");
    const characterSerif = document.getElementById("characterSerif");
    const closeEventBtn = document.getElementById("closeEventBtn");

    const prizes = [
      "IMG_9260.png",
      "IMG_9263.png"
    ];

    let clawX = 160;
    let direction = 1;
    let moving = false;
    let timer = null;
    let nextPlayGuaranteed = false;
    let currentTargetPrize = null;

    const normalSuccessRate = 0.25;
    const specialEventRateWhenFailed = 0.5;

    const specialMessages = [
      {
        name: "小清水 蓮",
        serif: "あー、失敗しちゃったね。\nじゃあ次は俺が取ってあげるから見てて！"
      },
      {
        name: "小清水 蓮",
        serif: "惜しかったね。\n次は俺に任せて？"
      },
      {
        name: "小清水 蓮",
        serif: "大丈夫。\n次はきっと取れるよ。俺が見てるから。"
      },
      {
        name: "小清水 蓮",
        serif: "そんな顔しないで？\nほら、次は俺の番。"
      }
    ];

    function makePrizeField() {
      prizeArea.innerHTML = "";

      const positions = [
        { left: 42, top: 160 },
        { left: 150, top: 145 },
        { left: 255, top: 165 },
        { left: 92, top: 75 },
        { left: 210, top: 70 }
      ];

      positions.forEach((pos, index) => {
        const img = document.createElement("img");
        img.className = "prizeItem";
        img.src = prizes[index % prizes.length];
        img.alt = "景品";
        img.style.left = pos.left + "px";
        img.style.top = pos.top + "px";
        img.dataset.baseLeft = pos.left;
        img.dataset.baseTop = pos.top;
        prizeArea.appendChild(img);
      });
    }

    function resetGame() {
      clawX = 160;
      direction = 1;
      moving = false;
      currentTargetPrize = null;

      claw.classList.remove("grabbing");
      claw.style.left = clawX + "px";
      claw.style.top = "72px";

      makePrizeField();

      message.textContent = nextPlayGuaranteed
        ? "次は特別チャンス♡"
        : "クレーンが動くよ♡";
    }

    function moveClaw() {
      clawX += direction * 4;

      if (clawX > 310) direction = -1;
      if (clawX < 10) direction = 1;

      claw.style.left = clawX + "px";
    }

    function findNearestPrize() {
      const items = [...document.querySelectorAll(".prizeItem")];

      let nearest = null;
      let nearestDistance = Infinity;

      items.forEach(item => {
        const itemCenterX = item.offsetLeft + item.offsetWidth / 2;
        const clawCenterX = clawX + claw.offsetWidth / 2;
        const distance = Math.abs(clawCenterX - itemCenterX);

        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearest = item;
        }
      });

      return {
        prize: nearest,
        distance: nearestDistance
      };
    }

    startBtn.addEventListener("click", () => {
      resetGame();

      moving = true;
      startBtn.disabled = true;
      catchBtn.disabled = false;

      timer = setInterval(moveClaw, 25);
    });

    catchBtn.addEventListener("click", () => {
      if (!moving) return;

      moving = false;
      clearInterval(timer);

      catchBtn.disabled = true;
      message.textContent = "アーム下降中...";

      const result = findNearestPrize();
      currentTargetPrize = result.prize;

      claw.style.top = "245px";

      setTimeout(() => {
        claw.classList.add("grabbing");
        message.textContent = "つかんだかも...！";
      }, 700);

      setTimeout(judgeCatch, 1250);
    });

    function judgeCatch() {
      const result = findNearestPrize();
      const isGoodPosition = result.distance < 68;

      if (!currentTargetPrize) {
        failCatch();
        return;
      }

      if (nextPlayGuaranteed) {
        nextPlayGuaranteed = false;
        liftPrize(true, "蓮くんが取ってくれたよ♡");
        return;
      }

      const isLucky = Math.random() < normalSuccessRate;

      if (isGoodPosition && isLucky) {
        liftPrize(true, "GET！景品を取れたよ♡");
      } else if (isGoodPosition) {
        liftPrize(false, "あっ、落ちちゃった...！");
      } else {
        missPrize();
      }
    }

    function liftPrize(success, text) {
      const clawLeft = clawX + claw.offsetWidth / 2 - currentTargetPrize.offsetWidth / 2;

      currentTargetPrize.classList.add("caught");
      currentTargetPrize.style.left = clawLeft + "px";
      currentTargetPrize.style.top = "150px";

      message.textContent = "持ち上げ中...！";

      setTimeout(() => {
        claw.style.top = "72px";
        currentTargetPrize.style.top = "35px";
      }, 500);

      if (success) {
        setTimeout(() => {
          message.textContent = text;
          currentTargetPrize.style.transform = "scale(1.18)";
          startBtn.disabled = false;
        }, 1300);
      } else {
        setTimeout(() => {
          currentTargetPrize.classList.add("drop");
          currentTargetPrize.style.top = currentTargetPrize.dataset.baseTop + "px";
          currentTargetPrize.style.left = currentTargetPrize.dataset.baseLeft + "px";
          message.textContent = text;
        }, 1300);

        setTimeout(() => {
          claw.classList.remove("grabbing");
          failCatch();
        }, 1900);
      }
    }

    function missPrize() {
      message.textContent = "空振りしちゃった...！";

      setTimeout(() => {
        claw.classList.remove("grabbing");
        claw.style.top = "72px";
      }, 700);

      setTimeout(failCatch, 1200);
    }

    function failCatch() {
      const showSpecialEvent = Math.random() < specialEventRateWhenFailed;

      if (showSpecialEvent) {
        nextPlayGuaranteed = true;
        showSpecialMessage();
      } else {
        message.textContent = "惜しい！もう一回チャレンジ♡";

        setTimeout(() => {
          claw.classList.remove("grabbing");
          claw.style.top = "72px";
          startBtn.disabled = false;
        }, 900);
      }
    }

    function showSpecialMessage() {
      const randomMessage = specialMessages[
        Math.floor(Math.random() * specialMessages.length)
      ];

      characterName.textContent = randomMessage.name;
      characterSerif.textContent = randomMessage.serif;
      otomeOverlay.style.display = "flex";
    }

    closeEventBtn.addEventListener("click", () => {
      otomeOverlay.style.display = "none";
      message.textContent = "次回は確定GETチャンス♡";
      claw.classList.remove("grabbing");
      claw.style.top = "72px";
      startBtn.disabled = false;
    });

    makePrizeField();
  </script>
</body>
</html>
