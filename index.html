      setFingerAngle(0);

      // 5. ロープを縮めて持ち上げ
      setTimeout(()=>{
        animRope(targetRope, ROPE_BASE, 700, ()=>{
          // 6. 景品をクローに追従させてシュートへ搬送
          detachPrize(currentPrize);
          carryToChute();
        });
        // 景品を上に追従させる
        const pL = Number(currentPrize.dataset.baseLeft);
        movePrizeWith(currentPrize, clawX - 40, pL, targetRope, ROPE_BASE, 700);
      }, 200);
    });
  }

  /* 景品をロープ縮小に合わせて上昇 */
  function movePrizeWith(item, targetL, baseL, ropeFrom, ropeTo, ms){
    const startPrizeTop = PRIZE_AREA_TOP + Number(item.dataset.baseTop);
    const startT = performance.now();
    function tick(now){
      const t = Math.min((now-startT)/ms, 1);
      const ease = t<.5?2*t*t:-1+(4-2*t)*t;
      const curRope = ropeFrom + (ropeTo-ropeFrom)*ease;
      // 先端Y = CLAW_HOME_Y + curRope + CLAW_TIP_Y - ROPE_BASE
      const tipY = CLAW_HOME_Y + curRope + CLAW_TIP_Y - ROPE_BASE;
      // game内 → prizeArea相対は detach後不要（game直下に移動済み）
      item.style.top  = (tipY - 40)+"px";
      item.style.left = (clawX - 40)+"px";
      if(t<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ─── CARRY TO CHUTE ─── */
  function carryToChute(){
    // 成功確定 or 確率チェック
    const succeed = nextGuaranteed || Math.random() < normalSuccessRate;
    if(nextGuaranteed) nextGuaranteed = false;

    // シュートX への移動距離
    const fromX   = clawX;
    const toX     = CHUTE_CENTER_X;
    const travelMs = Math.max(400, Math.abs(fromX - toX) * 2.2) | 0;

    // 途中落下チェック（成功しない場合のみ）
    const dropMidway = !succeed && Math.random() < DROP_CHANCE;
    const dropAtX    = dropMidway ? rnd(Math.min(fromX,toX)+20, Math.max(fromX,toX)-20) : 0;

    let dropped = false;
    const startT = performance.now();

    // クロー横移動
    clawWrap.style.transition = `left ${travelMs}ms linear`;
    clawWrap.style.left = (toX - 40)+"px";
    clawX = toX;

    // 景品も横に追従（毎フレーム）
    function followTick(now){
      if(dropped) return;
      const t = Math.min((now-startT)/travelMs, 1);
      const curX = fromX + (toX-fromX)*t;
      // tipY は rope=ROPE_BASE 時
      const tipY = CLAW_HOME_Y + ROPE_BASE + CLAW_TIP_Y - ROPE_BASE;
      currentPrize.style.left = (curX-40)+"px";
      currentPrize.style.top  = (CLAW_HOME_Y + CLAW_TIP_Y - 40)+"px";

      // 途中落下タイミング
      if(dropMidway && !dropped){
        const prizeX = curX;
        if( (fromX > toX && prizeX <= dropAtX) ||
            (fromX < toX && prizeX >= dropAtX) ){
          dropped = true;
          dropPrizeMidway(currentPrize, prizeX);
          return;
        }
      }
      if(t < 1) requestAnimationFrame(followTick);
      else{
        // 到着
        if(succeed){
          prizeLanded();
        } else {
          // 失敗（落とさなかった場合はシュート手前で落とす）
          dropPrizeMidway(currentPrize, toX + 20);
        }
      }
    }
    requestAnimationFrame(followTick);
  }

  /* 景品を指定X位置でフロアに落とす */
  function dropPrizeMidway(item, dropX){
    setFingerAngle(1); // 指を開く
    setTimeout(()=>setFingerAngle(0), 400);

    // 景品を現在位置から床まで落下
    const currentTop = parseFloat(item.style.top) || (CLAW_HOME_Y + CLAW_TIP_Y - 40);
    item.style.transition = "top .5s cubic-bezier(.25,.46,.45,.94), left .3s ease";
    item.style.left = (dropX - 40)+"px";
    item.style.top  = (FLOOR_Y - 80 - 10)+"px"; // 床の上に着地

    message.textContent = "あっ、落としちゃった…";
    setTimeout(()=>{
      // 軽くバウンス
      item.style.transition = "top .2s ease";
      item.style.top = (FLOOR_Y - 80)+"px";
    }, 550);

    // クロー戻す
    returnClawHome(()=> failFlow());
  }

  /* 景品がシュートに到達 → GET */
  function prizeLanded(){
    // 景品をシュート内へ落とす演出
    currentPrize.style.transition = "top .4s ease, left .3s ease, opacity .4s ease .3s";
    currentPrize.style.top  = (CHUTE_TOP_Y + 60)+"px";
    currentPrize.style.left = (CHUTE_CENTER_X - 40)+"px";
    setTimeout(()=>{
      currentPrize.style.opacity = "0";
    }, 350);

    message.textContent = nextGuaranteed ? "蓮くんが取ってくれたよ♡" : "GET♡";
    returnClawHome(()=> finishPlay());
  }

  /* クローをホームに戻す */
  function returnClawHome(cb){
    const ms = Math.max(350, Math.abs(clawX - 200) * 1.8)|0;
    clawWrap.style.transition = `left ${ms}ms ease`;
    clawWrap.style.left = (200 - 40)+"px";
    clawX = 200;
    setTimeout(()=>{
      if(cb) cb();
    }, ms + 50);
  }

  /* ─── FAIL FLOW ─── */
  function failFlow(){
    const showSpecial = Math.random() < specialEventOnFail;
    if(showSpecial){
      nextGuaranteed = true;
      showSpecialMessage();
    } else {
      if(!message.textContent) message.textContent = "惜しい！";
      finishPlay();
    }
  }

  function finishPlay(){
    isPlaying = false;
    setButtons(false);
    setFingerAngle(0);
  }

  function showSpecialMessage(){
    const m = specialMessages[Math.floor(Math.random()*specialMessages.length)];
    characterName.textContent  = m.name;
    characterSerif.textContent = m.serif;
    otomeOverlay.style.display = "flex";
  }

  /* ─── EVENTS ─── */
  titleStartBtn.addEventListener("click", ()=>{
    titleScreen.style.display = "none";
    gameScreen.style.display  = "block";
    makePrizeField();
    setClawX(200);
    resetClaw();
  });

  // 連打防止：touchstart で処理し、mousedown/click の二重発火をブロック
  function addMoveListener(btn, dir){
    let interval = null;
    function start(e){
      e.preventDefault();
      moveClaw(dir);
      interval = setInterval(()=> moveClaw(dir), 160);
    }
    function stop(){ clearInterval(interval); interval=null; }
    btn.addEventListener("touchstart", start, {passive:false});
    btn.addEventListener("touchend",   stop);
    btn.addEventListener("touchcancel",stop);
    btn.addEventListener("mousedown",  start);
    btn.addEventListener("mouseup",    stop);
    btn.addEventListener("mouseleave", stop);
  }
  addMoveListener(leftBtn,  -1);
  addMoveListener(rightBtn, +1);

  catchBtn.addEventListener("click", playCatch);

  closeEventBtn.addEventListener("click", ()=>{
    otomeOverlay.style.display = "none";
    message.textContent = "次回確定GETチャンス♡";
    finishPlay();
  });
</script>
</body>
</html>
