<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>これ〜んげ〜む</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #ffe8f4, #fff8fc);
      color: #6b3b55;
      text-align: center;
      min-height: 100vh;
    }

    .titleScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 151, 197, .35), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(255, 187, 122, .42), transparent 28%),
        linear-gradient(180deg, #ffe8f4, #fff8fc);
    }

    .titleLogo {
      font-size: 44px;
      color: #ff69a8;
      text-shadow: 3px 3px 0 #fff;
      letter-spacing: .08em;
      animation: popTitle .65s ease both;
      margin-bottom: 24px;
    }

    @keyframes popTitle {
      0% { opacity: 0; transform: scale(.65) translateY(18px); }
      70% { opacity: 1; transform: scale(1.12) translateY(0); }
      100% { transform: scale(1); }
    }

    .startGameBtn {
      font-size: 18px;
      padding: 15px 42px;
    }

    .gameScreen {
      display: none;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.45), transparent 18%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.35), transparent 20%),
        linear-gradient(135deg, #ff8fc6, #ffb16c, #ffd1df, #ff8fc6);
      background-size: 220% 220%;
      animation: waveGradient 9s ease-in-out infinite;
    }

    .gameScreen::before,
    .gameScreen::after {
      content: "";
      position: fixed;
      left: -20%;
      width: 140%;
      height: 180px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .gameScreen::before {
      top: 130px;
      background: rgba(255,255,255,.18);
      transform: rotate(-6deg);
      animation: waveMove 7s ease-in-out infinite alternate;
    }

    .gameScreen::after {
      top: 260px;
      background: rgba(255,230,170,.22);
      transform: rotate(5deg);
      animation: waveMove 9s ease-in-out infinite alternate-reverse;
    }

    @keyframes waveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes waveMove {
      from { transform: translateX(-24px) rotate(-6deg); }
      to { transform: translateX(24px) rotate(6deg); }
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 18px 14px 28px;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 34px;
      color: #fff;
      text-shadow:
        0 3px 0 #ff7db8,
        0 0 12px rgba(255,255,255,.85);
      letter-spacing: 0.05em;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: #fff;
      text-shadow: 0 2px 6px rgba(180, 80, 120, .35);
      font-weight: bold;
    }

    .game {
      position: relative;
      width: 100%;
      height: 520px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 22%),
        linear-gradient(#fff, #fff7fb);
      border: 7px solid rgba(255, 255, 255, .85);
      outline: 5px solid #ff9ccc;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 10px 25px rgba(255, 120, 170, 0.25),
        0 0 28px rgba(255,255,255,.65);
    }

    .machine-top {
      height: 72px;
      background: linear-gradient(90deg, #ffd1e6, #ffe0b8, #ffd1e6);
      border-bottom: 4px solid #ffadd1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ff5fa2;
      letter-spacing: .08em;
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      opacity: 0.85;
      animation: blink 1.6s infinite alternate;
      z-index: 1;
      color: #87506c;
      text-shadow: 0 0 10px #fff;
      pointer-events: none;
    }

    .s1 { top: 95px; left: 24px; }
    .s2 { top: 155px; right: 30px; animation-delay: .5s; }
    .s3 { bottom: 120px; left: 34px; animation-delay: .9s; }
    .s4 { top: 110px; right: 90px; animation-delay: .2s; }
    .s5 { top: 235px; left: 70px; animation-delay: .8s; }
    .s6 { bottom: 170px; right: 70px; animation-delay: 1.1s; }
    .s7 { top: 300px; right: 28px; animation-delay: .4s; }
    .s8 { bottom: 84px; left: 180px; animation-delay: 1.3s; }

    @keyframes blink {
      from { opacity: .25; transform: scale(.85) rotate(-8deg); }
      to { opacity: 1; transform: scale(1.22) rotate(8deg); }
    }

    .claw {
      position: absolute;
      top: 72px;
      left: 160px;
      width: 66px;
      z-index: 8;
      transition: top .75s ease, left .18s ease;
    }

    .rope {
      width: 6px;
      height: 48px;
      background: #c88aa5;
      margin: 0 auto;
      border-radius: 99px;
    }

    .clawHead {
      position: relative;
      width: 66px;
      height: 56px;
      margin: 0 auto;
    }

    .clawJoint {
      position: absolute;
      top: 0;
      left: 50%;
      width: 18px;
      height: 18px;
      background: #8b5b72;
      border-radius: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    .clawArm {
      position: absolute;
      top: 12px;
      width: 8px;
      height: 48px;
      background: #8b5b72;
      border-radius: 99px;
      transform-origin: top center;
      transition: transform .35s ease;
    }

    .clawArm.left {
      left: 22px;
      transform: rotate(38deg);
    }

    .clawArm.right {
      right: 22px;
      transform: rotate(-38deg);
    }

    .claw.grabbing .clawArm.left {
      transform: rotate(10deg);
    }

    .claw.grabbing .clawArm.right {
      transform: rotate(-10deg);
    }

    .prizeArea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 70px;
      height: 270px;
      z-index: 3;
    }

    .prizeItem {
      position: absolute;
      width: 86px;
      height: 86px;
      object-fit: contain;
      transition:
        top .7s ease,
        transform .4s ease,
        opacity .4s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .prizeItem.caught {
      z-index: 7;
      transform: translateY(-24px) scale(1.08);
    }

    .prizeItem.drop {
      transform: translateY(0) rotate(18deg) scale(.95);
    }

    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(90deg, #ffe0ee, #ffe7c7, #ffe0ee);
      border-top: 4px dashed #ff95c5;
      z-index: 2;
    }

    .controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      background: #ff7db8;
      color: white;
      box-shadow: 0 5px 0 #d94f8c;
      cursor: pointer;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #d94f8c;
    }

    button:disabled {
      background: #cfcfcf;
      box-shadow: 0 5px 0 #aaa;
      cursor: not-allowed;
    }

    .moveBtn {
      background: #ff9bcc;
      box-shadow: 0 5px 0 #d86aa3;
      font-size: 18px;
    }

    .message {
      margin-top: 14px;
      min-height: 30px;
      font-weight: bold;
      font-size: 17px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(180, 80, 120, .45);
    }

    .otomeOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(60, 40, 70, 0.45);
      z-index: 20;
      padding: 18px;
      align-items: center;
      justify-content: center;
    }

    .otomeCard {
      position: relative;
      width: min(92vw, 520px);
      height: 520px;
      background: linear-gradient(#eaf5ff, #fff);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,.25);
      border: 4px solid #c7ddff;
    }

    .characterArea {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 86px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.8), transparent 60%),
        linear-gradient(135deg, #dff1ff, #ffeaf5);
    }

    .dialogue {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      min-height: 178px;
      background: rgba(255,255,255,.92);
      border: 3px solid #b9d5ff;
      border-radius: 18px;
      padding: 18px;
      text-align: left;
    }

    .name {
      display: inline-block;
      padding: 6px 18px;
      background: #fff;
      border: 2px solid #b9d5ff;
      border-radius: 999px;
      font-weight: bold;
      color: #5b5b8f;
      margin-bottom: 12px;
    }

    .serif {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 16px;
      color: #333;
    }

    .nextBtn {
      margin-top: 12px;
      width: 100%;
      background: #8fb8ff;
      box-shadow: 0 5px 0 #5f8ee0;
    }
  </style>
</head>

<body>
  <div class="titleScreen" id="titleScreen">
    <div class="titleLogo">これ〜んげ〜む</div>
    <button class="startGameBtn" id="titleStartBtn">START</button>
  </div>

  <div class="gameScreen" id="gameScreen">
    <div class="wrap">
      <h1>これ〜んゲーム</h1>
      <p class="sub">かわいい景品をGETしよう♡<br>※特別な演出が発生する場合があります</p>

      <div class="game">
        <div class="machine-top">KOREEN GAME</div>

        <div class="sparkle s1">✦</div>
        <div class="sparkle s2">♡</div>
        <div class="sparkle s3">✧</div>
        <div class="sparkle s4">♡</div>
        <div class="sparkle s5">✦</div>
        <div class="sparkle s6">✧</div>
        <div class="sparkle s7">♡</div>
        <div class="sparkle s8">✦</div>

        <div class="claw" id="claw">
          <div class="rope"></div>
          <div class="clawHead">
            <div class="clawJoint"></div>
            <div class="clawArm left"></div>
            <div class="clawArm right"></div>
          </div>
        </div>

        <div class="prizeArea" id="prizeArea"></div>

        <div class="floor"></div>
      </div>

      <div class="controls">
        <button class="moveBtn" id="leftBtn">←</button>
        <button id="catchBtn">ここで取る！</button>
        <button class="moveBtn" id="rightBtn">→</button>
      </div>

      <div class="message" id="message"></div>
    </div>
  </div>

  <div class="otomeOverlay" id="otomeOverlay">
    <div class="otomeCard">
      <div class="characterArea">🌟</div>

      <div class="dialogue">
        <div class="name" id="characterName">小清水 蓮</div>
        <div class="serif" id="characterSerif"></div>
        <button class="nextBtn" id="closeEventBtn">次へ</button>
      </div>
    </div>
  </div>

  <script>
    const titleScreen = document.getElementById("titleScreen");
    const gameScreen = document.getElementById("gameScreen");
    const titleStartBtn = document.getElementById("titleStartBtn");

    const claw = document.getElementById("claw");
    const prizeArea = document.getElementById("prizeArea");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const catchBtn = document.getElementById("catchBtn");
    const message = document.getElementById("message");

    const otomeOverlay = document.getElementById("otomeOverlay");
    const characterName = document.getElementById("characterName");
    const characterSerif = document.getElementById("characterSerif");
    const closeEventBtn = document.getElementById("closeEventBtn");

    const prizes = [
      "IMG_9260.png",
      "IMG_9263.png"
    ];

    let clawX = 160;
    let isPlaying = false;
    let nextPlayGuaranteed = false;
    let currentTargetPrize = null;

    const normalSuccessRate = 0.25;
    const specialEventRateWhenFailed = 0.5;

    const specialMessages = [
      {
        name: "小清水 蓮",
        serif: "あー、失敗しちゃったね。\nじゃあ次は俺が取ってあげるから見てて！"
      },
      {
        name: "小清水 蓮",
        serif: "惜しかったね。\n次は俺に任せて？"
      },
      {
        name: "小清水 蓮",
        serif: "大丈夫。\n次はきっと取れるよ。俺が見てるから。"
      },
      {
        name: "小清水 蓮",
        serif: "そんな顔しないで？\nほら、次は俺の番。"
      }
    ];

    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffleArray(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function makePrizeField() {
      prizeArea.innerHTML = "";

      const basePositions = [
        { left: 35, top: 165 },
        { left: 145, top: 150 },
        { left: 250, top: 168 },
        { left: 80, top: 82 },
        { left: 205, top: 78 }
      ];

      const positions = shuffleArray(basePositions).map(pos => ({
        left: pos.left + randomBetween(-18, 18),
        top: pos.top + randomBetween(-14, 14)
      }));

      positions.forEach((pos, index) => {
        const img = document.createElement("img");
        img.className = "prizeItem";
        img.src = prizes[index % prizes.length];
        img.alt = "景品";
        img.style.left = pos.left + "px";
        img.style.top = pos.top + "px";
        img.dataset.baseLeft = pos.left;
        img.dataset.baseTop = pos.top;
        prizeArea.appendChild(img);
      });
    }

    function resetClaw() {
      clawX = 160;
      currentTargetPrize = null;
      claw.classList.remove("grabbing");
      claw.style.left = clawX + "px";
      claw.style.top = "72px";
      message.textContent = nextPlayGuaranteed ? "次回確定GETチャンス♡" : "";
    }

    function setButtonsDisabled(disabled) {
      leftBtn.disabled = disabled;
      rightBtn.disabled = disabled;
      catchBtn.disabled = disabled;
    }

    function moveClaw(amount) {
      if (isPlaying) return;

      clawX += amount;
      if (clawX < 10) clawX = 10;
      if (clawX > 310) clawX = 310;

      claw.style.left = clawX + "px";
    }

    function findTargetPrize() {
      const items = [...document.querySelectorAll(".prizeItem")];

      let target = null;
      let nearestDistance = Infinity;

      items.forEach(item => {
        const itemCenterX = item.offsetLeft + item.offsetWidth / 2;
        const clawCenterX = clawX + claw.offsetWidth / 2;
        const distance = Math.abs(clawCenterX - itemCenterX);

        if (distance < nearestDistance) {
          nearestDistance = distance;
          target = item;
        }
      });

      return {
        prize: target,
        distance: nearestDistance
      };
    }

    function playCatch() {
      if (isPlaying) return;

      isPlaying = true;
      setButtonsDisabled(true);
      message.textContent = "";

      const result = findTargetPrize();
      currentTargetPrize = result.prize;

      claw.style.top = "245px";

      setTimeout(() => {
        claw.classList.add("grabbing");
      }, 700);

      setTimeout(() => {
        judgeCatch(result.distance);
      }, 1200);
    }

    function judgeCatch(distance) {
      const isGoodPosition = distance < 68;

      if (!currentTargetPrize || !isGoodPosition) {
        missPrize();
        return;
      }

      if (nextPlayGuaranteed) {
        nextPlayGuaranteed = false;
        liftPrize(true, "蓮くんが取ってくれたよ♡");
        return;
      }

      const isLucky = Math.random() < normalSuccessRate;

      if (isLucky) {
        liftPrize(true, "GET♡");
      } else {
        liftPrize(false, "");
      }
    }

    function liftPrize(success, text) {
      const originalTop = Number(currentTargetPrize.dataset.baseTop);

      currentTargetPrize.classList.add("caught");
      currentTargetPrize.style.top = (originalTop - 34) + "px";

      setTimeout(() => {
        claw.style.top = "72px";
        currentTargetPrize.style.top = (originalTop - 118) + "px";
      }, 450);

      if (success) {
        setTimeout(() => {
          message.textContent = text;
          currentTargetPrize.style.transform = "translateY(-24px) scale(1.18)";
          finishPlay();
        }, 1250);
      } else {
        setTimeout(() => {
          currentTargetPrize.classList.add("drop");
          currentTargetPrize.style.top = currentTargetPrize.dataset.baseTop + "px";
        }, 1200);

        setTimeout(() => {
          claw.classList.remove("grabbing");
          failCatch();
        }, 1750);
      }
    }

    function missPrize() {
      setTimeout(() => {
        claw.classList.remove("grabbing");
        claw.style.top = "72px";
      }, 600);

      setTimeout(() => {
        failCatch();
      }, 1000);
    }

    function failCatch() {
      const showSpecialEvent = Math.random() < specialEventRateWhenFailed;

      if (showSpecialEvent) {
        nextPlayGuaranteed = true;
        showSpecialMessage();
      } else {
        message.textContent = "惜しい！";
        finishPlay();
      }
    }

    function finishPlay() {
      isPlaying = false;
      setButtonsDisabled(false);
      claw.classList.remove("grabbing");
      claw.style.top = "72px";
    }

    function showSpecialMessage() {
      const randomMessage = specialMessages[
        Math.floor(Math.random() * specialMessages.length)
      ];

      characterName.textContent = randomMessage.name;
      characterSerif.textContent = randomMessage.serif;
      otomeOverlay.style.display = "flex";
    }

    titleStartBtn.addEventListener("click", () => {
      titleScreen.style.display = "none";
      gameScreen.style.display = "block";
      makePrizeField();
      resetClaw();
    });

    leftBtn.addEventListener("click", () => {
      moveClaw(-28);
    });

    rightBtn.addEventListener("click", () => {
      moveClaw(28);
    });

    catchBtn.addEventListener("click", playCatch);

    closeEventBtn.addEventListener("click", () => {
      otomeOverlay.style.display = "none";
      message.textContent = "次回確定GETチャンス♡";
      finishPlay();
    });
  </script>
</body>
</html>
